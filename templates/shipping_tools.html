<!-- shipping_tools.html -->
<style>
/* ============================= */
/* ブランドゲート専用レイアウト   */
/* ============================= */
.brand-gate-grid {
  display: grid;
  grid-template-columns: 600px 1fr 1fr;
  gap: 12px;
}

.asin-panel .btn-row {
    margin: 8px 0;   /* 上下に余白 */
}

#bgc-table {
  table-layout: fixed;
  width: 100%;
  border-collapse: collapse;  /* 線を綺麗にする */
}

.table th {
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 2;
  border-bottom: 2px solid #999;
  padding: 6px 8px;
}

.table td {
  border-bottom: 1px solid #ccc;
  padding: 4px 8px;
  word-wrap: break-word;
}

/* ============================= */
/* ブランドゲート判定結果の色分け */
/* ============================= */
.status-open {
  color: green;
  font-weight: bold;
}

.status-approval {
  color: darkorange;
  font-weight: bold;
}

.status-block {
  color: red;
  font-weight: bold;
}

/* ============================= */
/* その他ツール：サブタブ         */
/* ============================= */
.st-subtabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  border-bottom: 2px solid #ddd;
}

.st-subtab-btn {
  background: #fff;
  border: 1px solid #ddd;
  border-bottom: none;
  padding: 8px 20px;
  cursor: pointer;
  font-size: 15px;
  border-radius: 6px 6px 0 0;
}

.st-subtab-btn.active {
  background: #4a90e2;
  color: #fff;
  border-color: #4a90e2;
}

.st-subtab-pane {
  display: none;
}

.st-subtab-pane.active {
  display: block;
}

/* ============================= */
/* 遠隔地郵便番号管理             */
/* ============================= */
.ra-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

#raCountryTable th,
#raCountryTable td {
  text-align: left;
  padding: 4px 8px;
  border-bottom: 1px solid #ccc;
}

/* ============================= */
/* 文書管理（定型文）             */
/* ============================= */
.dl-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.dl-grid {
  display: grid;
  grid-template-columns: 280px 340px 1fr;
  gap: 12px;
  align-items: start;
}

.dl-list {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 640px;
  overflow-y: auto;
}

.dl-list li {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 8px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.dl-list li:hover {
  background: #f3f7fc;
}

.dl-list li.active {
  background: #4a90e2;
  color: #fff;
}

.dl-list li .dl-name {
  flex: 1;
  word-break: break-all;
}

.dl-list li .dl-count {
  opacity: 0.7;
}

.dl-list li .dl-mini-btn {
  border: 1px solid #ccc;
  background: #fff;
  color: #333;
  border-radius: 4px;
  padding: 0 5px;
  cursor: pointer;
}

.dl-list li .dl-sub {
  display: block;
  opacity: 0.7;
}

.dl-empty {
  padding: 8px;
  color: #888;
}

.dl-body-view {
  white-space: pre-wrap;
  word-break: break-word;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 12px;
  background: #fafafa;
  min-height: 300px;
  max-height: 560px;
  overflow-y: auto;
}

.dl-form-row {
  margin-bottom: 8px;
}

.dl-form-row label {
  display: block;
  font-weight: bold;
  margin-bottom: 2px;
}

#dlEditTitle,
#dlEditCategory,
#dlEditBody {
  width: 100%;
  box-sizing: border-box;
  font: inherit;
}

#dlStatus {
  font-weight: bold;
}
</style>


<!-- ✅ その他ツール -->
<div class="main-container account-page">
<h2>TOOL</h2>

    <div class="st-subtabs">
        <button class="st-subtab-btn active" data-target="st-brandgate">Brand Gate</button>
        <button class="st-subtab-btn" data-target="st-remotearea">遠隔地郵便番号管理</button>
        <button class="st-subtab-btn" data-target="st-doclibrary">文書管理</button>
    </div>

    <!-- ▼ SUBTAB: Brand Gate Check -->
    <div id="st-brandgate" class="st-subtab-pane active">
    <div class="card" style="margin-bottom:20px;">

        <h2>Brand Gate</h2>

        <div class="brand-gate-grid">

            <!-- 左：入力 -->
            <div class="card asin-panel">
                <h3>ASIN</h3>

                <div id="brandgateStatus" style="margin-bottom:6px; font-weight:bold;">
                    Status: Idle
                </div>

                <div class="btn-row">
                    <button id="bgc-run" class="btn-blue">Check</button>
                    <button id="bgc-clear" class="btn-blue" type="button">Clear</button>
                </div>

                <textarea id="bgc-asins" rows="40"
                    placeholder="ASINを1行ずつ入力&#10;Samle>&#10;B000000001&#10;B000000002"
                    style="width:100%; font-size:16px;"></textarea>
            </div>

            <!-- 右：結果 -->
            <div class="card result-panel">
                <h3>RESULT</h3>

                <div class="btn-row">
                    <button id="bgc-export-csv" class="btn-blue">Export CSV</button>
                </div>

                <div style="overflow:auto; max-height:420px;">
                    <table id="bgc-table" class="table" style="width:100%;">
                        <thead>
                            <tr>
                                <th style="text-align:left;">ASIN</th>
                                <th style="text-align:left;">Result</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card extra-panel">
                <h3>BRAND</h3>

                <button id="bgc-extract-brand" class="btn-blue">Extract Brand</button>

                <div style="overflow:auto; max-height:420px;">
                    <table id="bgc-brand-table" class="table" style="width:100%;">
                        <thead>
                            <tr>
                                <th style="text-align:left;">ASIN</th>
                                <th style="text-align:left;">Brand</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
    </div>
    <!-- ▲ SUBTAB: Brand Gate Check -->

    <!-- ▼ SUBTAB: 遠隔地郵便番号管理 -->
    <div id="st-remotearea" class="st-subtab-pane">

        <datalist id="raCountryList"></datalist>

        <div class="ra-grid">

            <!-- 取り込み -->
            <div class="card">
                <h3>取り込み</h3>
                <p>Excelの「郵便番号from」「郵便番号to」の2列をそのままコピーして貼り付けてください（タブ区切り）。1回の取り込みにつき1キャリア・1国分。</p>

                <div class="row">
                    <label class="label">キャリア</label>
                    <select id="raImportCarrier">
                        <option value="DHL">DHL</option>
                        <option value="FEDEX">FedEx</option>
                    </select>
                </div>

                <div class="row">
                    <label class="label">国コード</label>
                    <input id="raImportCountry" list="raCountryList" placeholder="例: AU" style="width:120px; text-transform:uppercase;">
                </div>

                <div class="row">
                    <label class="label">貼り付け</label>
                    <textarea id="raImportText" rows="10"
                        placeholder="例）&#10;7321	7321&#10;7325	7325&#10;X0A0A0	X0A1Z9"
                        style="width:100%;"></textarea>
                </div>

                <div class="row">
                    <span class="label"></span>
                    <div class="btn-row">
                        <button id="raImportBtn" class="btn-blue">取り込む</button>
                        <button id="raImportClearBtn" class="btn-blue" type="button">クリア</button>
                    </div>
                </div>

                <div id="raImportStatus" style="margin-top:6px; font-weight:bold;"></div>
            </div>

            <!-- 登録済み一覧 / リセット -->
            <div class="card">
                <h3>登録済みデータ・リセット</h3>

                <div class="row">
                    <label class="label">キャリア</label>
                    <select id="raResetCarrier">
                        <option value="DHL">DHL</option>
                        <option value="FEDEX">FedEx</option>
                    </select>
                    <button id="raResetLoadBtn" class="btn-blue">一覧表示</button>
                </div>

                <table id="raCountryTable" style="width:100%; margin-top:10px;">
                    <thead>
                        <tr>
                            <th>国</th>
                            <th>件数</th>
                            <th>取込日</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 郵便番号判定 -->
        <div class="card" style="margin-top:16px;">
            <h3>郵便番号判定</h3>
            <p>指定した国・郵便番号がDHL/FedExそれぞれの遠隔地エリアに該当するかを判定します。</p>

            <div class="row" style="display:flex; align-items:center; gap:12px;">
                <label class="label">国コード</label>
                <input id="raCheckCountry" list="raCountryList" style="width:120px; text-transform:uppercase;">
                <label class="label">郵便番号</label>
                <input id="raCheckPostal" style="width:160px;">
                <button id="raCheckBtn" class="btn-blue">判定する</button>
            </div>

            <div id="raCheckResult" style="margin-top:12px;"></div>
        </div>

        <!-- CSV出力 -->
        <div class="card" style="margin-top:16px;">
            <h3>CSV出力</h3>

            <div class="row" style="display:flex; align-items:center; gap:12px;">
                <label class="label">キャリア</label>
                <select id="raExportCarrier">
                    <option value="DHL">DHL</option>
                    <option value="FEDEX">FedEx</option>
                </select>
                <label class="label">国コード</label>
                <input id="raExportCountry" list="raCountryList" style="width:120px; text-transform:uppercase;">
                <button id="raExportBtn" class="btn-blue">CSVをダウンロード</button>
            </div>
        </div>

    </div>
    <!-- ▲ SUBTAB: 遠隔地郵便番号管理 -->

    <!-- ▼ SUBTAB: 文書管理（定型文） -->
    <div id="st-doclibrary" class="st-subtab-pane">

        <div class="card">
            <div class="dl-toolbar">
                <input id="dlSearch" type="search" placeholder="タイトル・本文で検索" style="width:260px;">
                <button id="dlNewBtn" class="btn-blue" type="button">＋ 新しい文書</button>
                <span style="flex:1;"></span>
                <button id="dlExportBtn" class="btn-blue" type="button">エクスポート</button>
                <button id="dlImportBtn" class="btn-blue" type="button">インポート</button>
                <input id="dlImportFile" type="file" accept=".json,application/json" style="display:none;">
            </div>
            <div id="dlStatus"></div>
        </div>

        <div class="dl-grid" style="margin-top:12px;">

            <!-- 左：カテゴリ -->
            <div class="card">
                <h3>カテゴリ</h3>
                <ul id="dlCategoryList" class="dl-list"></ul>
                <div style="margin-top:8px;">
                    <button id="dlAddCategoryBtn" class="btn-blue" type="button">＋ カテゴリ追加</button>
                </div>
            </div>

            <!-- 中：文書一覧 -->
            <div class="card">
                <h3 id="dlListTitle">文書</h3>
                <ul id="dlTemplateList" class="dl-list"></ul>
            </div>

            <!-- 右：本文（表示／編集） -->
            <div class="card">
                <div id="dlViewEmpty" class="dl-empty">左の一覧から文書を選んでください。</div>

                <div id="dlView" style="display:none;">
                    <h3 id="dlViewTitle" style="margin-top:0;"></h3>
                    <div id="dlViewCategory" style="opacity:0.7; margin-bottom:8px;"></div>
                    <div class="dl-toolbar">
                        <button id="dlCopyBtn" class="btn-blue" type="button">コピー</button>
                        <span id="dlCopyMsg" style="color:green; font-weight:bold;"></span>
                        <span style="flex:1;"></span>
                        <button id="dlEditBtn" class="btn-blue" type="button">編集</button>
                        <button id="dlDeleteBtn" class="btn-blue" type="button">削除</button>
                    </div>
                    <div id="dlViewBody" class="dl-body-view"></div>
                </div>

                <div id="dlEdit" style="display:none;">
                    <h3 id="dlEditHeading" style="margin-top:0;"></h3>
                    <div class="dl-form-row">
                        <label for="dlEditCategory">カテゴリ</label>
                        <select id="dlEditCategory"></select>
                    </div>
                    <div class="dl-form-row">
                        <label for="dlEditTitle">タイトル</label>
                        <input id="dlEditTitle" type="text">
                    </div>
                    <div class="dl-form-row">
                        <label for="dlEditBody">本文</label>
                        <textarea id="dlEditBody" rows="22"></textarea>
                    </div>
                    <div class="dl-toolbar">
                        <button id="dlSaveBtn" class="btn-blue" type="button">保存</button>
                        <button id="dlCancelBtn" class="btn-blue" type="button">キャンセル</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <!-- ▲ SUBTAB: 文書管理（定型文） -->

</div>
